name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. The more of these fields you can fill
        in, the faster the issue can be triaged and fixed.

        **Security issue?** Please don't post it here. See
        [SECURITY.md](https://github.com/princelundgren/PrinceListsObsidianPlugin/blob/main/SECURITY.md)
        for the private channel.

  - type: input
    id: plugin-version
    attributes:
      label: PrinceLists version
      description: From Settings → Community plugins → Installed plugins (e.g. `0.1.0`).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: From Settings → General, at the top of the page (e.g. `1.14.4`).
      placeholder: "1.14.4"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Mac
        - iPhone
        - Other (say which under "Anything else?")
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior you observed.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Numbered list works best. The more specific the better.
      placeholder: |
        1. Open a list with ...
        2. Tick the item ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: list-sample
    attributes:
      label: A sample of the list note
      description: |
        Open the list as Markdown and paste the part that shows the problem. Remove anything
        personal first.
      render: markdown

  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: |
        In Obsidian, open the command palette, run "Show debug info", choose "Copy to clipboard",
        and paste it here. It lists your OS version and enabled plugins.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Screenshots, screen recordings, other plugins that might interfere. Drop them here.
