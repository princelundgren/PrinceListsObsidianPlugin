version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The types match the oldest Node.js the scripts support (AGENTS.md), as in Obsidian's sample plugin.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Majors, here and in actions, and the runtime dependency keep a pull request each.
      development:
        dependency-type: development
        update-types: [minor, patch]
