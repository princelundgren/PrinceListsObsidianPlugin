name: Release Obsidian plugin

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    build:
        runs-on: ubuntu-latest
        # The environment's required reviewer approves before anything is built, signed or released.
        environment: release
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false

            - name: Check the tag is the manifest's version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "::error::The tag $tag isn't manifest.json's version $version."
                    exit 1
                  fi
                  VERSION="$version" node -e "process.exit(require('./versions.json')[process.env.VERSION] ? 0 : 1)" ||
                    { echo "::error::versions.json has no entry for $version."; exit 1; }

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
                  retention-days: 1

    # Runs no project code, so npm's install scripts never see the write token or the signing token.
    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title="$tag" \
                    --draft \
                    --verify-tag \
                    main.js manifest.json styles.css
