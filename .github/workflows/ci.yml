name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26

            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test
